<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire Leads — Connexion | Prospection B2B automatisée</title>
  <meta name="description" content="Connectez-vous a Empire Leads pour trouver des entreprises sans site web via Google Maps. Prospection B2B, CRM pipeline, pitch IA personnalise.">
  <meta name="keywords" content="Empire Leads, connexion, prospection B2B, CRM prospection, leads B2B, trouver des clients, entreprises sans site web">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://empireleads.fr/login">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Empire Leads — Connexion | Prospection B2B automatisee">
  <meta property="og:description" content="Connectez-vous a Empire Leads pour trouver des entreprises sans site web. CRM pipeline + pitch IA.">
  <meta property="og:url" content="https://empireleads.fr/login">
  <meta property="og:site_name" content="Empire Leads">
  <meta property="og:image" content="https://empireleads.fr/og-image.png">
  <meta property="og:locale" content="fr_FR">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Empire Leads — Connexion">
  <meta name="twitter:description" content="Connectez-vous a Empire Leads. Prospection B2B, CRM pipeline, pitch IA.">
  <meta name="twitter:image" content="https://empireleads.fr/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #FAFAF9;
      --grad: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      --glow: rgba(34,197,94,.3);
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --text: #111827;
      --text2: #4B5563;
      --muted: #9CA3AF;
      --border: #E5E7EB;
      --border2: #D1D5DB;
      --card: #FFFFFF;
      --surface: #F3F4F6;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ── BACKGROUND ── */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: .12;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 600px; height: 600px; background: #22c55e; top: -200px; left: -150px; animation-delay: 0s; }
    .orb-2 { width: 500px; height: 500px; background: #4ade80; bottom: -150px; right: -100px; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: #FED7AA; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.1); }
    }

    canvas#sparks { display: none; }

    /* ── CARD ── */
    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px; padding: 1rem;
      animation: slideUp .6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow:
        0 1px 3px rgba(0,0,0,.06),
        0 10px 40px rgba(0,0,0,.08),
        0 0 0 1px rgba(249,115,22,.06);
      border-top: 3px solid var(--accent);
    }

    /* ── LOGO ── */
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 56px; height: 56px; margin: 0 auto .8rem;
      background: var(--grad); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 6px 20px var(--glow);
    }
    .logo h1 {
      font-size: 1.5rem; font-weight: 900; letter-spacing: -.04em;
      color: var(--text);
    }
    .logo p { color: var(--muted); font-size: .82rem; margin-top: .3rem; }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: .4rem; margin-bottom: 1.5rem;
      background: var(--surface); border-radius: 12px; padding: .3rem;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1; padding: .55rem; border: none; border-radius: 9px;
      background: transparent; color: var(--muted);
      font-size: .8rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .2s; text-align: center;
    }
    .tab:hover { color: var(--text2); }
    .tab.on {
      background: var(--grad); color: #fff;
      box-shadow: 0 3px 12px var(--glow);
    }

    /* ── FORM ── */
    .form { display: none; }
    .form.on { display: block; }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: .68rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: .4rem;
    }
    .inp-wrap { position: relative; }
    .inp {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px; padding: .75rem 1rem; color: var(--text);
      font-size: .88rem; outline: none; font-family: inherit;
      transition: all .2s;
    }
    .inp:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249,115,22,.12);
      background: #fff;
    }
    .inp::placeholder { color: var(--muted); }

    /* ── BUTTON ── */
    .btn {
      width: 100%; padding: .9rem; margin-top: .75rem;
      background: var(--grad); color: #fff; border: none; border-radius: 10px;
      font-size: .92rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: all .2s; position: relative; overflow: hidden;
      box-shadow: 0 4px 20px var(--glow);
    }
    .btn::after {
      content: '';
      position: absolute; top: -50%; left: -60%;
      width: 40%; height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      transform: skewX(-20deg);
      transition: left .5s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px var(--glow); }
    .btn:hover::after { left: 130%; }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── MESSAGES ── */
    .error, .success {
      border-radius: 10px; padding: .7rem 1rem; font-size: .82rem;
      margin-bottom: 1rem; display: none; animation: fadeIn .3s ease;
    }
    .error.on { display: block; background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.2); color: #DC2626; }
    .success.on { display: block; background: rgba(22,163,74,.06); border: 1px solid rgba(22,163,74,.2); color: #16A34A; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    /* ── FOOTER ── */
    .login-footer {
      text-align: center; margin-top: 1.5rem;
      font-size: .75rem; color: var(--muted);
    }
    .login-footer a {
      color: var(--accent);
      font-weight: 600; text-decoration: none;
    }
    .login-footer a:hover { color: var(--accent-dark); }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: .8rem;
      margin: 1rem 0; color: var(--muted); font-size: .7rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<canvas id="sparks"></canvas>

<div class="login-wrap">
  <div class="login-box">
    <div class="logo">
      <h1 style="font-size:2rem;font-weight:900;letter-spacing:1px;font-family:'Arial Black',sans-serif;text-transform:uppercase;color:var(--text1)">EMPIRE<span style="color:var(--accent)">LEADS</span></h1>
      <p>La prospection B2B, simplifiée.</p>
    </div>

    <div class="tabs">
      <button class="tab on" onclick="showTab('login')">Connexion</button>
      <button class="tab" onclick="showTab('register')">Créer un compte</button>
    </div>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <div id="form-login" class="form on">
      <div class="field">
        <label>Email</label>
        <input class="inp" type="email" id="login-email" placeholder="tonmail@business.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input class="inp" type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">Se connecter</button>
    </div>

    <div id="form-register" class="form">
      <div class="field">
        <label>Email</label>
        <input class="inp" type="email" id="reg-email" placeholder="boss@empire.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input class="inp" type="password" id="reg-pass" placeholder="6 caractères minimum" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirmer</label>
        <input class="inp" type="password" id="reg-pass2" placeholder="Le même, confirme bb" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-register" onclick="doRegister()">Créer mon compte</button>
    </div>

    <!-- Google Sign-In -->
    <div id="google-signin-wrap" style="display:none;margin-top:1rem;text-align:center">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div>
        <span style="font-size:.75rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.05em">ou</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div>
      </div>
      <button id="btn-google" onclick="doGoogleLogin()" style="width:100%;padding:12px 20px;background:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .2s">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#FBBC05" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuer avec Google
      </button>
    </div>

    <div class="login-footer" id="login-footer">
      <a href="/">← Retour à l'accueil</a>
    </div>
  </div>
</div>

<script>
// ── SPARKS ──
const canvas = document.getElementById('sparks');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 1.5 + .3;
    this.vx = (Math.random() - .5) * .3;
    this.vy = -Math.random() * .5 - .1;
    this.life = 1; this.decay = Math.random() * .003 + .001;
    this.hue = Math.random() < .5 ? 260 : 200;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.life -= this.decay;
    if (this.life <= 0) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},80%,70%,${this.life * .6})`;
    ctx.fill();
  }
}

for (let i = 0; i < 120; i++) particles.push(new Particle());
(function loop() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
})();

// ── AUTH ──
if (localStorage.getItem('ph_token')) window.location.href = '/app';

const urlParams = new URLSearchParams(location.search);
const refCode = urlParams.get('ref');
if (urlParams.get('tab') === 'register') setTimeout(() => showTab('register'), 50);
if (refCode) setTimeout(() => { showTab('register'); showSuccess('Ton pote t\'a invité ! +5 crédits gratuits 🎁'); }, 100);

// ── DEMO MODE: hide "Retour à l'accueil" for mockup/beta links ──
// Uses sessionStorage (tab-scoped) so it doesn't pollute the normal site
// Cleanup old localStorage key if it exists (legacy)
try { localStorage.removeItem('ph_demo'); } catch(e) {}
if (urlParams.has('demo')) {
  sessionStorage.setItem('ph_demo', '1');
}
if (sessionStorage.getItem('ph_demo') === '1') {
  const footer = document.getElementById('login-footer');
  if (footer) footer.style.display = 'none';
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('on', i === (tab === 'login' ? 0 : 1)));
  document.getElementById('form-login').classList.toggle('on', tab === 'login');
  document.getElementById('form-register').classList.toggle('on', tab === 'register');
  hideMessages();
}
function showError(msg) { const e = document.getElementById('error'); e.textContent = msg; e.classList.add('on'); document.getElementById('success').classList.remove('on'); }
function showSuccess(msg) { const e = document.getElementById('success'); e.textContent = msg; e.classList.add('on'); document.getElementById('error').classList.remove('on'); }
function hideMessages() { document.getElementById('error').classList.remove('on'); document.getElementById('success').classList.remove('on'); }

async function doLogin() {
  hideMessages();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!email || !password) return showError('Remplis tous les champs 🙄');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Connexion...';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Email ou mot de passe incorrect.');
    localStorage.setItem('ph_token', data.token);
    localStorage.setItem('ph_user', JSON.stringify(data.user));
    btn.textContent = 'Connexion réussie';
    setTimeout(() => window.location.href = '/app', 400);
  } catch { showError('Pas de connexion. Vérifie ton réseau 📡'); }
  finally { btn.disabled = false; if (btn.textContent === 'Connexion...') btn.textContent = 'Se connecter'; }
}

async function doRegister() {
  hideMessages();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  const password2 = document.getElementById('reg-pass2').value;
  if (!email || !password || !password2) return showError('Tous les champs sont requis.');
  if (password !== password2) return showError('Les mots de passe ne correspondent pas 🙃');
  if (password.length < 6) return showError('Mot de passe trop court (6 car. mini).');
  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.textContent = 'Création...';
  try {
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, referral_code: refCode || undefined }) });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Erreur lors de l\'inscription.');
    localStorage.setItem('ph_token', data.token);
    localStorage.setItem('ph_user', JSON.stringify(data.user));
    btn.textContent = 'Bienvenue !';
    setTimeout(() => window.location.href = '/app', 500);
  } catch { showError('Problème de connexion réseau.'); }
  finally { btn.disabled = false; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').classList.contains('on')) doLogin();
    else doRegister();
  }
});

// ── GOOGLE SIGN-IN (standard OAuth 2.0 redirect — no GSI library needed) ──
var _googleClientId = '';
(function() {
  // Handle Google redirect callback (token in URL params after successful login)
  var params = new URLSearchParams(window.location.search);
  if (params.get('google_token')) {
    localStorage.setItem('ph_token', params.get('google_token'));
    var userData = decodeURIComponent(params.get('google_user') || '{}');
    localStorage.setItem('ph_user', userData);
    var isNew = params.get('new') === '1';
    var userName = '';
    try { userName = JSON.parse(userData).display_name || ''; } catch(e) {}
    var firstName = userName.split(' ')[0] || '';
    // Show welcome message
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;gap:16px';
    overlay.innerHTML = isNew
      ? '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg><div style="font-size:28px;font-weight:800;color:#fff">Bienvenue' + (firstName ? ', ' + firstName : '') + '</div><div style="font-size:15px;color:#aaa">Votre espace Empire Leads est prêt.</div>'
      : '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><div style="font-size:28px;font-weight:800;color:#fff">Connexion réussie</div><div style="font-size:15px;color:#aaa">' + (firstName || 'Content de vous revoir') + '</div>';
    document.body.appendChild(overlay);
    setTimeout(function() { window.location.href = '/app'; }, isNew ? 2500 : 1500);
    return;
  }
  if (params.get('error')) {
    var errMap = { google_missing: 'Code Google manquant.', google_disabled: 'Google Sign-In non configure.', google_invalid: 'Token Google invalide.', google_fail: 'Erreur connexion Google.', disabled: 'Compte desactive.', google_token_fail: 'Echange token echoue: ' + (params.get('detail') || ''), google_no_token: 'Google n\'a pas renvoye de token.', google_bad_jwt: 'JWT Google invalide.', google_no_email: 'Pas d\'email dans le compte Google.' };
    showError(errMap[params.get('error')] || 'Erreur Google.');
  }
  // Check if Google OAuth is enabled
  fetch('/api/auth/google-enabled').then(r => r.json()).then(d => {
    if (!d.enabled) return;
    _googleClientId = d.clientId;
    var wrap = document.getElementById('google-signin-wrap');
    if (wrap) wrap.style.display = '';
  }).catch(function(){});
})();

function doGoogleLogin() {
  if (!_googleClientId) return showError('Google Sign-In non configure.');
  var redirectUri = encodeURIComponent(window.location.origin + '/api/auth/google/redirect');
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(_googleClientId) + '&redirect_uri=' + redirectUri + '&response_type=code&scope=openid%20email%20profile&prompt=select_account';
}

async function handleGoogleResponse(response) {
  if (!response.credential) return showError('Erreur Google Sign-In.');
  var btn = document.getElementById('btn-google');
  if (btn) { btn.disabled = true; btn.textContent = 'Connexion...'; }
  try {
    var res = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    var data = await res.json();
    if (!res.ok) { showError(data.error || 'Erreur connexion Google.'); return; }
    localStorage.setItem('ph_token', data.token);
    localStorage.setItem('ph_user', JSON.stringify(data.user));
    if (btn) btn.textContent = 'Connecté';
    setTimeout(function() { window.location.href = '/app'; }, 400);
  } catch { showError('Erreur reseau.'); }
  finally { if (btn) { btn.disabled = false; } }
}
</script>
</body>
</html>
