<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08110c"/>
      <stop offset="50%" stop-color="#0b1a11"/>
      <stop offset="100%" stop-color="#04080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="rgba(74,222,128,0.12)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo top left -->
  <g transform="translate(72, 72)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#16a34a"/>
    <path d="M15 18h24v5h-19v5h15v5h-15v5h19v5h-24z" fill="#fff"/>
    <text x="70" y="24" font-family="'Satoshi','Switzer','Inter',sans-serif" font-weight="900" font-size="22" fill="#fff" letter-spacing="-0.5">EMPIRE</text>
    <text x="70" y="48" font-family="'Satoshi','Switzer','Inter',sans-serif" font-weight="900" font-size="22" fill="#4ade80" letter-spacing="-0.5">LEADS</text>
  </g>

  <!-- Stars top right -->
  <g transform="translate(1030, 86)" text-anchor="end">
    <text x="0" y="0" font-family="'Inter',sans-serif" font-size="16" fill="#4ade80" font-weight="700" letter-spacing="3">★★★★★</text>
    <text x="0" y="22" font-family="'Inter',sans-serif" font-size="13" fill="rgba(255,255,255,0.55)" font-weight="500">Logiciel de prospection B2B</text>
  </g>

  <!-- Main title -->
  <g transform="translate(72, 260)">
    <text x="0" y="0" font-family="'Switzer','Satoshi','Inter',sans-serif" font-weight="800" font-size="72" fill="#fff" letter-spacing="-2.5">Les <tspan fill="#4ade80">meilleurs prospects</tspan></text>
    <text x="0" y="82" font-family="'Switzer','Satoshi','Inter',sans-serif" font-weight="800" font-size="72" fill="#fff" letter-spacing="-2.5">ne sont pas en ligne.</text>
  </g>

  <!-- Subtitle -->
  <text x="72" y="440" font-family="'Satoshi','Inter',sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.72)" letter-spacing="-0.3">
    Empire Leads détecte les commerces sans site ni réseaux.
  </text>
  <text x="72" y="472" font-family="'Satoshi','Inter',sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.72)" letter-spacing="-0.3">
    Téléphone, email, décideur — directement dans votre CRM.
  </text>

  <!-- CTA badge bottom -->
  <g transform="translate(72, 540)">
    <rect x="0" y="0" width="260" height="54" rx="27" fill="#16a34a"/>
    <text x="130" y="34" text-anchor="middle" font-family="'Satoshi','Inter',sans-serif" font-weight="800" font-size="18" fill="#fff">Démarrer gratuitement →</text>
  </g>
  <text x="352" y="574" font-family="'Satoshi','Inter',sans-serif" font-weight="600" font-size="15" fill="rgba(255,255,255,0.5)">empire-leads.fr</text>

  <!-- Decorative corner constellation right -->
  <g transform="translate(900, 340)" opacity="0.5">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(74,222,128,0.25)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(74,222,128,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="32" fill="#16a34a"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Satoshi','Inter',sans-serif" font-weight="900" font-size="22" fill="#fff">E</text>
    <circle cx="-110" cy="-30" r="4" fill="#4ade80"/>
    <circle cx="100" cy="-50" r="4" fill="#4ade80"/>
    <circle cx="120" cy="60" r="4" fill="#4ade80"/>
    <circle cx="-70" cy="90" r="4" fill="#4ade80"/>
    <circle cx="-120" cy="20" r="3" fill="rgba(74,222,128,0.6)"/>
    <circle cx="50" cy="110" r="3" fill="rgba(74,222,128,0.6)"/>
  </g>
</svg>
